# Swagger API Documentation for Library Management API
# All endpoints are documented here

paths:
  # ==================== AUTH ROUTES ====================

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Create a new student or librarian account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - role
              properties:
                name:
                  type: string
                  example: Rahul
                email:
                  type: string
                  example: rahul@gmail.com
                password:
                  type: string
                  example: "123456"
                role:
                  type: string
                  enum: [student, librarian]
                  example: student
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registered successfully
                  user:
                    type: object
                    properties:
                      userId:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                      createdAt:
                        type: string
        400:
          description: Validation failed
        409:
          description: Email already registered

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login a user
      description: Login with email and password to get a JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: rahul@gmail.com
                password:
                  type: string
                  example: "123456"
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        401:
          description: Invalid email or password

  /api/auth/profile:
    get:
      tags:
        - Authentication
      summary: Get current user profile
      description: Get the profile of the currently logged-in user
      security:
        - bearerAuth: []
      responses:
        200:
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      userId:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
        401:
          description: Unauthorized
    put:
      tags:
        - Authentication
      summary: Update current user profile
      description: Update name, email, or password of the logged-in user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Rahul Updated
                email:
                  type: string
                  example: rahul.updated@gmail.com
                password:
                  type: string
                  example: newpassword123
      responses:
        200:
          description: Profile updated successfully
        401:
          description: Unauthorized

  # ==================== BOOK ROUTES ====================

  /api/books:
    get:
      tags:
        - Books
      summary: Get all books
      description: Get all books with optional filters (category, status, author)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: category
          schema:
            type: string
          description: Filter by category
          example: Programming
        - in: query
          name: status
          schema:
            type: string
            enum: [available, borrowed]
          description: Filter by status
        - in: query
          name: author
          schema:
            type: string
          description: Filter by author
      responses:
        200:
          description: List of books
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: integer
                  books:
                    type: array
                    items:
                      type: object
                      properties:
                        bookId:
                          type: string
                        title:
                          type: string
                        author:
                          type: string
                        isbn:
                          type: string
                        category:
                          type: string
                        status:
                          type: string
                        quantity:
                          type: integer
                        createdAt:
                          type: string
        401:
          description: Unauthorized
    post:
      tags:
        - Books
      summary: Add a new book (Librarian only)
      description: Add a new book to the library
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - author
                - isbn
                - category
                - quantity
              properties:
                title:
                  type: string
                  example: JavaScript Basics
                author:
                  type: string
                  example: John Smith
                isbn:
                  type: string
                  example: "123456789"
                category:
                  type: string
                  example: Programming
                quantity:
                  type: integer
                  example: 5
      responses:
        201:
          description: Book added successfully
        400:
          description: Validation failed
        401:
          description: Unauthorized
        403:
          description: Only librarians can perform this action

  /api/books/search:
    get:
      tags:
        - Books
      summary: Search books
      description: Search books by title or author
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
          description: Search query (title or author)
          example: javascript
      responses:
        200:
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: integer
                  books:
                    type: array
                    items:
                      type: object
        400:
          description: Search query is required
        401:
          description: Unauthorized

  /api/books/{id}:
    get:
      tags:
        - Books
      summary: Get a single book
      description: Get a book by its ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Book ID
      responses:
        200:
          description: Book details
        404:
          description: Book not found
        401:
          description: Unauthorized
    put:
      tags:
        - Books
      summary: Update a book (Librarian only)
      description: Update book details
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Book ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                author:
                  type: string
                isbn:
                  type: string
                category:
                  type: string
                quantity:
                  type: integer
                status:
                  type: string
                  enum: [available, borrowed]
      responses:
        200:
          description: Book updated successfully
        404:
          description: Book not found
        401:
          description: Unauthorized
        403:
          description: Only librarians can perform this action
    delete:
      tags:
        - Books
      summary: Delete a book (Librarian only)
      description: Delete a book from the library
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Book ID
      responses:
        200:
          description: Book deleted successfully
        404:
          description: Book not found
        401:
          description: Unauthorized
        403:
          description: Only librarians can perform this action

  /api/books/{id}/borrow:
    post:
      tags:
        - Books
      summary: Borrow a book (Student only)
      description: Borrow a book from the library. Due date is 14 days from borrowing.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Book ID
      responses:
        200:
          description: Book borrowed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Book borrowed successfully
                  transaction:
                    type: object
                    properties:
                      transactionId:
                        type: string
                      userId:
                        type: string
                      bookId:
                        type: string
                      type:
                        type: string
                        example: borrow
                      borrowDate:
                        type: string
                      returnDate:
                        type: string
                        nullable: true
                      dueDate:
                        type: string
                      status:
                        type: string
                        example: active
        400:
          description: Book not available or already borrowed
        404:
          description: Book not found
        401:
          description: Unauthorized
        403:
          description: Only students can perform this action

  /api/books/{id}/return:
    post:
      tags:
        - Books
      summary: Return a book (Student only)
      description: Return a borrowed book to the library
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Book ID
      responses:
        200:
          description: Book returned successfully
        400:
          description: No active borrow found for this book
        401:
          description: Unauthorized
        403:
          description: Only students can perform this action

  # ==================== TRANSACTION ROUTES ====================

  /api/transactions:
    get:
      tags:
        - Transactions
      summary: Get all transactions (Librarian only)
      description: Get all borrow and return transactions
      security:
        - bearerAuth: []
      responses:
        200:
          description: All transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: integer
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        transactionId:
                          type: string
                        userId:
                          type: string
                        bookId:
                          type: string
                        type:
                          type: string
                        borrowDate:
                          type: string
                        returnDate:
                          type: string
                        dueDate:
                          type: string
                        status:
                          type: string
        401:
          description: Unauthorized
        403:
          description: Only librarians can perform this action

  /api/transactions/my:
    get:
      tags:
        - Transactions
      summary: Get my transactions
      description: Get transactions of the currently logged-in user
      security:
        - bearerAuth: []
      responses:
        200:
          description: Your transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: integer
                  transactions:
                    type: array
                    items:
                      type: object
        401:
          description: Unauthorized

  # ==================== USER ROUTES ====================

  /api/users:
    get:
      tags:
        - Users
      summary: Get all users (Librarian only)
      description: Get a list of all registered users
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: integer
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                        name:
                          type: string
                        email:
                          type: string
                        role:
                          type: string
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
        401:
          description: Unauthorized
        403:
          description: Only librarians can perform this action

  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get a single user (Librarian only)
      description: Get a user by their ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: User ID
      responses:
        200:
          description: User details
        404:
          description: User not found
        401:
          description: Unauthorized
        403:
          description: Only librarians can perform this action
    delete:
      tags:
        - Users
      summary: Delete a user (Librarian only)
      description: Delete a user account
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: User ID
      responses:
        200:
          description: User deleted successfully
        404:
          description: User not found
        401:
          description: Unauthorized
        403:
          description: Only librarians can perform this action

  /api/users/{id}/role:
    put:
      tags:
        - Users
      summary: Update user role (Librarian only)
      description: Change a user's role to student or librarian
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum: [student, librarian]
                  example: librarian
      responses:
        200:
          description: User role updated successfully
        400:
          description: Invalid role
        404:
          description: User not found
        401:
          description: Unauthorized
        403:
          description: Only librarians can perform this action
